spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mboatech}?sslmode=${DB_SSL_MODE:prefer}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 10000
      validation-timeout: 5000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: ${SERVER_PORT:8082}
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 300

# Origines autorisées pour CORS (HTTP + handshake WebSocket), séparées par des virgules.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8443}

# Répertoire public (photos de profil/portfolio servies par /uploads/**).
upload:
  dir: ${UPLOAD_DIR:./uploads}

# Répertoire privé (documents KYC : jamais servis par /uploads/**, uniquement
# via l'endpoint authentifié /api/kyc/file/{filename}).
private-upload:
  dir: ${PRIVATE_UPLOAD_DIR:./private-uploads}

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO

# Passerelle de paiement « HR-Skills Pay » (api.hrskills-pay.com).
# Authentification à double clé : HRSK_API_KEY (clé A, publique) + HRSK_API_SECRET
# (clé B, secrète, échangée contre un transaction token). HRSK_WEBHOOK_SECRET sert
# à vérifier la signature des webhooks. HRSK_ENABLED doit être vrai pour activer
# les paiements réels (jamais de clé en clair dans le dépôt).
# Autres surcharges : HRSK_RETURN_URL, HRSK_CANCEL_URL, HRSK_WEBHOOK_URL.
hrskills:
  enabled: ${HRSK_ENABLED:true}
  api-key: ${HRSK_API_KEY:}
  api-secret: ${HRSK_API_SECRET:}
  webhook-secret: ${HRSK_WEBHOOK_SECRET:}
  api-base: ${HRSK_API_BASE:https://api.hrskills-pay.com}
  country: ${HRSK_COUNTRY:CM}
  currency: ${HRSK_CURRENCY:XAF}
  return-url: ${HRSK_RETURN_URL:http://localhost:5173}
  cancel-url: ${HRSK_CANCEL_URL:http://localhost:5173}
  webhook-url: ${HRSK_WEBHOOK_URL:http://localhost:8082/api/payments/webhook}

# Garde-fous contre l'accaparement des demandes d'intervention.
# - max-concurrent : nombre max de demandes réservées (acceptées) en même temps
#   PAR NIVEAU D'URGENCE (critique / important / normal), compté en continu à
#   partir des réservations du technicien. Il ne se réinitialise pas : il ne
#   baisse que lorsque le technicien termine ou décline une intervention.
# - reservation-hours : durée de validité d'une réservation avant libération auto.
# - reservation-*-hours : durée par niveau d'urgence (critique < important < normal).
# - max-declines : nombre de déclins acceptés dans la fenêtre avant gel des acceptations.
# - declines-window-hours : fenêtre de comptage des déclins (le gel se lève quand
#   le nombre de déclins récents redevient inférieur au seuil).
missions:
  max-concurrent: ${MISSIONS_MAX_CONCURRENT:3}
  reservation-hours: ${MISSIONS_RESERVATION_HOURS:24}
  reservation-critique-hours: ${MISSIONS_RESERVATION_CRITIQUE_HOURS:1}
  reservation-important-hours: ${MISSIONS_RESERVATION_IMPORTANT_HOURS:4}
  reservation-normal-hours: ${MISSIONS_RESERVATION_NORMAL_HOURS:8}
  max-declines: ${MISSIONS_MAX_DECLINES:3}
  declines-window-hours: ${MISSIONS_DECLINES_WINDOW_HOURS:24}

# Programme d'attestations de service des techniciens.
# - min-rating : note moyenne minimum pour générer une attestation.
# - number-prefix : préfixe des numéros (suffixe = ID auto-incrément, unique).
# - signatory-name / signatory-role : signature unique imprimée sur le PDF.
# - threshold-* : interventions requises par niveau (bronze < silver < gold < diamond).
attestation:
  min-rating: ${ATTESTATION_MIN_RATING:3.5}
  number-prefix: ${ATTESTATION_NUMBER_PREFIX:MBT-}
  platform-name: ${ATTESTATION_PLATFORM_NAME:MboaTech}
  title: ${ATTESTATION_TITLE:ATTESTATION DE SERVICE}
  signatory-role: ${ATTESTATION_SIGNATORY_ROLE:RESPONSABLE PLATEFORME}
  threshold-bronze: ${ATTESTATION_THRESHOLD_BRONZE:1}
  threshold-silver: ${ATTESTATION_THRESHOLD_SILVER:2}
  threshold-gold: ${ATTESTATION_THRESHOLD_GOLD:3}
  threshold-diamond: ${ATTESTATION_THRESHOLD_DIAMOND:5}

admin:
  email: ${ADMIN_EMAIL:admin@mboatech.com}
  password: ${ADMIN_PASSWORD:}
