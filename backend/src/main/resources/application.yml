spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mboatech}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 10000
      validation-timeout: 5000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect
server:
  port: ${SERVER_PORT:8082}
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 300

# Origines autorisées pour CORS (HTTP + handshake WebSocket), séparées par des virgules.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8443}

# Répertoire public (photos de profil/portfolio servies par /uploads/**).
upload:
  dir: ${UPLOAD_DIR:./uploads}

# Répertoire privé (documents KYC : jamais servis par /uploads/**, uniquement
# via l'endpoint authentifié /api/kyc/file/{filename}).
private-upload:
  dir: ${PRIVATE_UPLOAD_DIR:./private-uploads}

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO

# Passerelle de paiement Paymee (paymee.tn).
# PAYMEE_ENABLED doit être vrai et PAYMEE_API_KEY fournie via l'environnement
# pour activer les paiements réels (jamais de clé en clair dans le dépôt).
# NB : le serveur sandbox (sandbox.paymee.tn) était injoignable au moment des tests.
# Autres surcharges : PAYMEE_RETURN_URL, PAYMEE_CANCEL_URL, PAYMEE_WEBHOOK_URL.
paymee:
  enabled: ${PAYMEE_ENABLED:false}
  api-key: ${PAYMEE_API_KEY:}
  api-base: ${PAYMEE_API_BASE:https://sandbox.paymee.tn/api/v2}
  return-url: ${PAYMEE_RETURN_URL:http://localhost:5173}
  cancel-url: ${PAYMEE_CANCEL_URL:http://localhost:5173}
  webhook-url: ${PAYMEE_WEBHOOK_URL:http://localhost:8082/api/payments/webhook}

# Garde-fous contre l'accaparement des demandes d'intervention.
# - max-concurrent : nombre max de demandes réservées (acceptées) en même temps
#   PAR NIVEAU D'URGENCE (critique / important / normal), compté en continu à
#   partir des réservations du technicien. Il ne se réinitialise pas : il ne
#   baisse que lorsque le technicien termine ou décline une intervention.
# - reservation-hours : durée de validité d'une réservation avant libération auto.
# - reservation-*-hours : durée par niveau d'urgence (critique < important < normal).
# - max-declines : nombre de déclins acceptés dans la fenêtre avant gel des acceptations.
# - declines-window-hours : fenêtre de comptage des déclins (le gel se lève quand
#   le nombre de déclins récents redevient inférieur au seuil).
missions:
  max-concurrent: ${MISSIONS_MAX_CONCURRENT:3}
  reservation-hours: ${MISSIONS_RESERVATION_HOURS:24}
  reservation-critique-hours: ${MISSIONS_RESERVATION_CRITIQUE_HOURS:1}
  reservation-important-hours: ${MISSIONS_RESERVATION_IMPORTANT_HOURS:4}
  reservation-normal-hours: ${MISSIONS_RESERVATION_NORMAL_HOURS:8}
  max-declines: ${MISSIONS_MAX_DECLINES:3}
  declines-window-hours: ${MISSIONS_DECLINES_WINDOW_HOURS:24}

admin:
  email: ${ADMIN_EMAIL:admin@mboatech.com}
  password: ${ADMIN_PASSWORD:}
