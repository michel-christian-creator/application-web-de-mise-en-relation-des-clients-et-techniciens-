# nginx — MboaTech production
#
# Rôle :
#   1. Sert le frontend construit (dist/ issu de `npm run build`).
#   2. Proxie /api et /ws vers le backend Spring Boot (127.0.0.1:8082).
#   3. Termine TLS (bloc 443 commenté, activable après obtention d'un
#      certificat — Let's Encrypt via certbot recommandé, section 7 du guide).
#
# IMPORTANT : ce bloc sert l'application en HTTP (port 80) sans redirection,
# pour que le site fonctionne dès le premier déploiement. Une fois le
# certificat obtenu, certbot ajoute lui-même la redirection HTTP → HTTPS.
#
# Placement :
#   cp deploy/nginx.conf /etc/nginx/sites-available/mboa-tech
#   ln -s /etc/nginx/sites-available/mboa-tech /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

# Frontend construit (SPA).
root /opt/mboa-tech/frontend;
index index.html;

client_max_body_size 25m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ── HTTPS (bloc alternatif). À activer avec le certificat :
    #    remplacer la ligne `listen 80` ci-dessus par :
    #      listen 443 ssl http2;
    #      listen [::]:443 ssl http2;
    #      ssl_certificate     /etc/letsencrypt/live/mboatech.com/fullchain.pem;
    #      ssl_certificate_key /etc/letsencrypt/live/mboatech.com/privkey.pem;
    #      ssl_protocols       TLSv1.2 TLSv1.3;
    #      ssl_session_cache   shared:SSL:10m;
    #    puis ajouter le bloc ci-dessous pour forcer HTTPS :
    # if ($scheme != "https") { return 301 https://$host$request_uri; }

    # Cache des assets hachés par Vite (public, long).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA : toute route non-fichier renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Spring Boot.
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket (chat temps réel, /ws/chat/{requestId}) avec mise à niveau HTTP.
    location /ws {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
